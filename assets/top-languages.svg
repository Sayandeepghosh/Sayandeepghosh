<svg
  xmlns="http://www.w3.org/2000/svg"
  width="500"
  height="210"
  viewBox="0 0 500 210"
  role="img"
  aria-label="Top programming languages"
>
<style>
  .title {
    font: 600 20px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif;
    fill: #58a6ff;
  }
  .lang {
    font: 500 13px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif;
    fill: #c9d1d9;
  }
  .pct {
    font: 400 12px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif;
    fill: #8b949e;
  }
  .footer {
    font: 400 11px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif;
    fill: #6e7681;
  }
</style>

<rect
  x="1"
  y="1"
  rx="10"
  width="498"
  height="208"
  fill="#0d1117"
  stroke="#30363d"
/>

<text x="24" y="36" class="title">Top Languages</text>

<clipPath id="barClip">
  <rect x="25" y="55" width="450" height="11" rx="5"/>
</clipPath>

<g clip-path="url(#barClip)">
  <rect x="25.00" y="55" width="185.58" height="11" fill="#3572A5" /><rect x="210.58" y="55" width="93.86" height="11" fill="#3178c6" /><rect x="304.44" y="55" width="42.06" height="11" fill="#f1e05a" /><rect x="346.50" y="55" width="34.68" height="11" fill="#563d7c" /><rect x="381.18" y="55" width="32.06" height="11" fill="#8b949e" /><rect x="413.23" y="55" width="24.15" height="11" fill="#8b949e" />
</g>

<circle cx="30" cy="96" r="5" fill="#3572A5" /><text x="42" y="100" class="lang">Python</text><text x="220" y="100" class="pct" text-anchor="end">41.2%</text><circle cx="265" cy="96" r="5" fill="#3178c6" /><text x="277" y="100" class="lang">TypeScript</text><text x="455" y="100" class="pct" text-anchor="end">20.9%</text><circle cx="30" cy="131" r="5" fill="#f1e05a" /><text x="42" y="135" class="lang">JavaScript</text><text x="220" y="135" class="pct" text-anchor="end">9.3%</text><circle cx="265" cy="131" r="5" fill="#563d7c" /><text x="277" y="135" class="lang">CSS</text><text x="455" y="135" class="pct" text-anchor="end">7.7%</text><circle cx="30" cy="166" r="5" fill="#8b949e" /><text x="42" y="170" class="lang">TeX</text><text x="220" y="170" class="pct" text-anchor="end">7.1%</text><circle cx="265" cy="166" r="5" fill="#8b949e" /><text x="277" y="170" class="lang">SCSS</text><text x="455" y="170" class="pct" text-anchor="end">5.4%</text>

<text x="24" y="198" class="footer">
  Calculated from original public repositories
</text>
</svg>
