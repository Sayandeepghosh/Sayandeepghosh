<svg
  xmlns="http://www.w3.org/2000/svg"
  width="500"
  height="210"
  viewBox="0 0 500 210"
  role="img"
  aria-label="Top programming languages"
>
<style>
  .title {
    font: 600 20px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif;
    fill: #58a6ff;
  }
  .lang {
    font: 500 13px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif;
    fill: #c9d1d9;
  }
  .pct {
    font: 400 12px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif;
    fill: #8b949e;
  }
  .footer {
    font: 400 11px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif;
    fill: #6e7681;
  }
</style>

<rect
  x="1"
  y="1"
  rx="10"
  width="498"
  height="208"
  fill="#0d1117"
  stroke="#30363d"
/>

<text x="24" y="36" class="title">Top Languages</text>

<clipPath id="barClip">
  <rect x="25" y="55" width="450" height="11" rx="5"/>
</clipPath>

<g clip-path="url(#barClip)">
  <rect x="25.00" y="55" width="170.99" height="11" fill="#3178c6" /><rect x="195.99" y="55" width="144.41" height="11" fill="#3572A5" /><rect x="340.40" y="55" width="44.38" height="11" fill="#563d7c" /><rect x="384.78" y="55" width="30.29" height="11" fill="#f1e05a" /><rect x="415.07" y="55" width="22.28" height="11" fill="#e34c26" /><rect x="437.34" y="55" width="15.44" height="11" fill="#8b949e" />
</g>

<circle cx="30" cy="96" r="5" fill="#3178c6" /><text x="42" y="100" class="lang">TypeScript</text><text x="220" y="100" class="pct" text-anchor="end">38.0%</text><circle cx="265" cy="96" r="5" fill="#3572A5" /><text x="277" y="100" class="lang">Python</text><text x="455" y="100" class="pct" text-anchor="end">32.1%</text><circle cx="30" cy="131" r="5" fill="#563d7c" /><text x="42" y="135" class="lang">CSS</text><text x="220" y="135" class="pct" text-anchor="end">9.9%</text><circle cx="265" cy="131" r="5" fill="#f1e05a" /><text x="277" y="135" class="lang">JavaScript</text><text x="455" y="135" class="pct" text-anchor="end">6.7%</text><circle cx="30" cy="166" r="5" fill="#e34c26" /><text x="42" y="170" class="lang">HTML</text><text x="220" y="170" class="pct" text-anchor="end">5.0%</text><circle cx="265" cy="166" r="5" fill="#8b949e" /><text x="277" y="170" class="lang">TeX</text><text x="455" y="170" class="pct" text-anchor="end">3.4%</text>

<text x="24" y="198" class="footer">
  Calculated from original public repositories
</text>
</svg>
